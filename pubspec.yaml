name: liqima
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio:
  shared_preferences:
  flutter_bloc:
  bloc:
  flutter_onboard:
  fluttertoast: ^8.2.1
  conditional_builder_null_safety:
  carousel_slider: ^5.0.0
  buttons_tabbar: ^1.3.10
  sqflite:
  url_launcher:
  share_plus:
  pdf:
  printing:
  intl:
  image_picker:
  lottie: ^3.3.1
  http_parser: ^4.0.2
  top_snackbar_flutter: ^3.2.0
  onesignal_flutter: ^5.3.0
  fw_tab_bar: ^0.0.3
  google_nav_bar: ^5.0.7
  font_awesome_flutter: ^10.9.0
  socket_io_client: ^3.0.2
  shimmer: ^3.0.0
  like_button: ^2.0.5
  flutter_animate: ^4.3.0
  awesome_snackbar_content: ^0.1.5
  iconsax: ^0.0.8
  animated_bottom_navigation_bar: ^1.3.3
  ionicons: ^0.2.2
  google_maps_flutter: ^2.14.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0


flutter:

  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: cairo
      fonts:
        - asset: assets/fonts/Cairo/static/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo/static/Cairo-Bold.ttf
          weight: 700
    - family: tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Bold.ttf
